projects:
  - id: quadcopter
    number: "01"
    category: "FLIGHT CONTROL / EMBEDDED SYSTEMS"
    title: "A small aircraft.<br>A complete system."
    name: "Tiny Quadcopter"
    image: "/images/real_front.png"
    image_alt: "Ruigang's mini quadcopter prototype with its flight control circuit"
    tags: "STM32 / UCOSIII / PCB DESIGN"
    description: "A custom flight controller combining hardware design, inertial sensing and real-time attitude control. Built around the STM32F103C8T6, with quaternion-based attitude estimation and cascaded PID control."
    hardware: "https://gitee.com/ruigang_chen/tiny-quadcopter"
    software: "https://gitee.com/ruigang_chen/quadcopter-ucosiii"
    detail_image: "/images/Show.gif"
    detail_alt: "Animated demonstration of the quadcopter project"
  - id: inductance
    number: "02"
    category: "SENSING / ELECTRONICS"
    title: "Making the invisible<br>measurable."
    name: "Inductance Detection Module"
    image: "/images/Inductance-Detection-Module-Sch.png"
    image_alt: "Schematic of the four-channel inductance detection module"
    tags: "LMV358 / ANALOG CIRCUITS / PCB DESIGN"
    description: "A four-channel electromagnetic sensing circuit using LC resonance and LMV358 operational amplifiers. The module collects a 20 kHz electromagnetic signal and provides a conditioned output for a microcontroller."
    hardware: "https://github.com/ruigangchen2/Inductance-Detection-Module"
    detail_image: "/images/Inductance-Detection-Module-PCB.png"
    detail_alt: "PCB layout of the inductance detection module"

